app-id: xyz.lalaggi.semitone
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: semitone

finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=wayland
  - --filesystem=xdg-music
  - --filesystem=home
  - --talk-name=org.gtk.vfs.*

cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - /share/vala
  - "*.la"
  - "*.a"

modules:
  - name: semitone
    builddir: true
    buildsystem: meson
    sources:
      - type: dir
        path: ../../
